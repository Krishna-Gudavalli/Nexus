services:
  nexus:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    volumes:
      - nexus-data:/app/data
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles: ["infra"]
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    profiles: ["infra"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  nexus-data:
  postgres-data:
  redis-data:
